[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openfinance"
version = "0.0.0"
description = "Reproducible, point-in-time financial research infrastructure (early-stage foundation)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenFinance contributors" }]
keywords = ["finance", "point-in-time", "backtesting", "research", "reproducibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]

# No runtime dependencies yet. Dependencies are added only when a component
# that needs them is implemented.
dependencies = []

[project.urls]
Homepage = "https://github.com/openfinance/openfinance"
Repository = "https://github.com/openfinance/openfinance"
Documentation = "https://github.com/openfinance/openfinance/tree/main/docs"
Issues = "https://github.com/openfinance/openfinance/issues"

[dependency-groups]
# Development tooling. Installed with `uv sync` (uv reads dependency-groups by
# default). Kept intentionally minimal.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openfinance"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
